name: Import Charikot Open Source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Download sanitized source bundle
        env:
          SHARE_URL: https://firestorage.ai/ja/f/ycExinYpPuxr
          FILE_NAME: Charikot-OpenSource-v0.1.1.zip
        run: |
          cat > /tmp/download-source.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const share = process.env.SHARE_URL;
          const filename = process.env.FILE_NAME;
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({acceptDownloads:true});
          await page.goto(share, {waitUntil:'networkidle', timeout:120000});
          await page.waitForTimeout(2500);

          let done = false;
          const anchors = page.locator('a');
          const count = await anchors.count();
          for (let i=0; i<count && !done; i++) {
            const a = anchors.nth(i);
            const text = ((await a.innerText().catch(()=>'')) || '').trim();
            const href = (await a.getAttribute('href')) || '';
            const dl = (await a.getAttribute('download')) || '';
            if ([text, href, dl].some(v => v.includes(filename))) {
              try {
                const [download] = await Promise.all([
                  page.waitForEvent('download', {timeout:30000}),
                  a.click()
                ]);
                await download.saveAs('/tmp/source.zip');
                done = true;
              } catch {}
            }
          }

          if (!done) {
            const nameLoc = page.getByText(filename, {exact:false}).first();
            if (await nameLoc.count()) {
              let node = nameLoc;
              for (let level=0; level<7 && !done; level++) {
                const candidates = node.locator('a,button');
                const n = await candidates.count();
                for (let j=0; j<n && !done; j++) {
                  const c = candidates.nth(j);
                  const label = (((await c.innerText().catch(()=>'')) || '') + ' ' + ((await c.getAttribute('aria-label')) || '') + ' ' + ((await c.getAttribute('title')) || '')).toLowerCase();
                  if (label.includes('download') || label.includes('ダウンロード') || n === 1) {
                    try {
                      const [download] = await Promise.all([
                        page.waitForEvent('download', {timeout:30000}),
                        c.click()
                      ]);
                      await download.saveAs('/tmp/source.zip');
                      done = true;
                    } catch {}
                  }
                }
                node = node.locator('..');
              }
            }
          }

          await browser.close();
          if (!done || !fs.existsSync('/tmp/source.zip')) throw new Error('Source bundle download failed');
          EOF
          node /tmp/download-source.mjs
          echo '1ea6c440d095a08af227630f01bd30d527e76ef900e60079e0e7e267c016473a  /tmp/source.zip' | sha256sum -c -

      - name: Import source tree
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          unzip -q /tmp/source.zip -d .
          rm -f .github/workflows/import-charikot-source.yml

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/charikot/parentlock/MainActivity.kt
          test -f app/src/main/java/com/charikot/parentlock/ProtectionService.kt
          test -f README.md
          test -f LICENSE

          if find . -type f \( -name '*.jks' -o -name '*.keystore' \) | grep -q .; then
            echo 'Refusing to publish signing key' >&2
            exit 1
          fi
          if find . -type f -path '*/signing/*' | grep -q .; then
            echo 'Refusing to publish signing directory' >&2
            exit 1
          fi

      - name: Commit open-source project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Charikot v0.1.1 open-source Android source'
          git push origin main
